name: CI

on:
  push:
    branches:
      # NB: All branches while this fork iterates without an upstream PR; restrict to main when
      #     the PR is cut, or every PR commit runs the matrix twice (push + pull_request).
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  macos:
    strategy:
      matrix:
        xcode:
          - '16.4'

    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      # Run through xcodebuild rather than `swift test`: only xcodebuild collects the
      # reference/failure/difference image attachments, so a red run is diagnosable from the
      # uploaded bundle instead of a bare "Snapshot does not match".
      - name: Run tests
        env:
          # xcodebuild does not forward the job environment to the test process — unlike
          # `swift test`, which is how the machine-dependent macOS asserts have been skipping on
          # CI. The TEST_RUNNER_ prefix is passed through with the prefix stripped, preserving
          # that behavior; without it those asserts run here and fail.
          TEST_RUNNER_GITHUB_WORKFLOW: ${{ github.workflow }}
        run: make test-macos RESULT_BUNDLE=TestResults.xcresult
      # The suite records on failure, so the checked-out references are overwritten by the CI
      # render before the job ends. The attachments are built from in-memory data beforehand, so
      # the bundle keeps the real diff; the __Snapshots__ copy is what CI actually rendered.
      - name: Upload result bundle and CI-rendered snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcresult
          path: |
            TestResults.xcresult
            Tests/SnapshotTestingTests/__Snapshots__

  visionos:
    strategy:
      matrix:
        xcode:
          - '16.4'

    name: visionOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      # No TEST_RUNNER_GITHUB_WORKFLOW here on purpose: this job has always run without the guard
      # reaching the test process, so the guarded asserts do execute on visionOS and pass against
      # simulator-canonical references. Forwarding it would silently skip them.
      - name: Run tests
        run: make test-visionos RESULT_BUNDLE=TestResults.xcresult
      - name: Upload result bundle and CI-rendered snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-xcresult
          path: |
            TestResults.xcresult
            Tests/SnapshotTestingTests/__Snapshots__

  ubuntu:
    strategy:
      matrix:
        swift:
          - '6.1'

    container: swift:${{ matrix.swift }}
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  android:
    strategy:
      matrix:
        swift:
          - "6.2"
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: ${{ matrix.swift }}
          copy-files: ${GITHUB_WORKSPACE}/Tests/SnapshotTestingTests/__Snapshots__
          # AssertSnapshot.swift hardcodes this path for os(Android); the
          # action's default changed to swift-android-tests in v2.9.5.
          android-emulator-test-folder: /data/local/tmp/android-xctest
